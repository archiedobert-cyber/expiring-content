name: Expiring Content Checker
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test (send again even if today's digest was already posted)"
        required: false
        default: false
        type: boolean
      test_url:
        description: "Test a specific page: paste an SBC, Objectives or Evolutions link (optional)"
        required: false
        default: ""
        type: string
  schedule:
    # Runs are in UTC. This targets roughly 9am UK — 9 hours before the
    # 6pm daily expiry. UK clocks shift for daylight saving, so actual
    # local time may drift by an hour for part of the year — adjust if
    # that matters to you.
    - cron: "2 8 * * *"  # daily digest
permissions:
  contents: write
jobs:
  check-expiring-content:
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Started: $(date -u)"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run expiry checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ secrets.DISCORD_ROLE_ID }}
          TEST_MODE: ${{ inputs.test && '1' || '' }}
          TEST_URL: ${{ inputs.test_url }}
        run: python expiring.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f state.json ]; then
            git add state.json
            git diff --staged --quiet || git commit -m "Update state"
            git push
          else
            echo "No state.json present yet (nothing was posted this run) — nothing to commit."
          fi
